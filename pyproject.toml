[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-booster"
version = "0.1.0"
description = "Measured Qwen inference experiments and reusable primitives for Apple Silicon"
requires-python = ">=3.11"
dependencies = ["mlx-lm==0.32.0", "mlx==0.32.3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# The serving path is an experiment layer on a pinned MLX-VLM revision; the
# full locked environment is in requirements-vlm.lock.
serve = ["mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@66e68ce36816cb5134acba3b0d72c6271f35ba24"]
dev = ["pytest>=8"]

[project.scripts]
qwen-booster = "qwen_booster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
