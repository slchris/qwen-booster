[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-booster"
version = "0.1.0"
description = "Measured Qwen inference optimization and workload comparison for Apple Silicon"
requires-python = ">=3.11"
dependencies = ["mlx-lm==0.32.0", "mlx==0.32.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qwen-booster = "qwen_booster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
